name: soulsync
description: "SoulSync - A private synchronized music streaming application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  rxdart: ^0.28.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/music/
    - assets/songs/
    - assets/animations/
    - assets/fonts/
